name: api

on:
  push:
    branches: [main]
    paths:
      - apps/api/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - infra/smoke.sh
      - .github/workflows/api.yml
  workflow_dispatch:

# Deploys run one at a time and are never cancelled halfway (a migration may be running).
concurrency:
  group: api-deploy
  cancel-in-progress: false

# Actions are pinned to commit SHAs (tags can be moved to malicious code; these jobs get AWS credentials).
permissions:
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine # same major as local dev and Neon
        env:
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: portfolio
          POSTGRES_DB: portfolio_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U portfolio" --health-interval 2s --health-retries 30
    env:
      DATABASE_URL: postgresql://portfolio:portfolio@localhost:5432/portfolio_test
      PUBLIC_URL: http://localhost:3000
      JWT_ACCESS_SECRET: ci-only-access-secret-0123456789abcdef
      JWT_REFRESH_SECRET: ci-only-refresh-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm --filter api exec prisma generate
      - run: pnpm --filter api lint
      - run: pnpm --filter api exec prisma migrate deploy
      - run: pnpm --filter api test

  deploy:
    needs: test
    # Native ARM runner: builds the arm64 (Graviton) image without emulation.
    runs-on: ubuntu-24.04-arm
    # The AWS deploy role only trusts this environment (restricted to main, optional manual approval in GitHub).
    environment: production
    permissions:
      contents: read
      id-token: write # OIDC: exchanged for short-lived AWS credentials, no stored keys
    env:
      # ECR tags are immutable: run id + attempt keep re-runs of the same commit deployable.
      IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          mask-aws-account-id: true # public repo: public logs
          role-to-assume: ${{ secrets.AWS_API_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Build and push image
        id: image
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:$IMAGE_TAG"
          # Plain image manifest: attestations would make it an image index, which Lambda rejects.
          docker build --provenance=false --sbom=false -f apps/api/Dockerfile --target prod -t "$IMAGE" .
          docker push "$IMAGE"
          echo "uri=$IMAGE" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: corepack enable && pnpm install --frozen-lockfile

      # Migrations run BEFORE the new code goes live, so they must stay compatible with the code still running
      # (expand/contract: add first, remove in a later release). Neon's direct URL: the pooler can't run them.
      - name: Migrate database
        run: |
          DATABASE_URL=$(aws ssm get-parameter --name "${{ vars.SSM_DIRECT_DATABASE_URL }}" --with-decryption --query Parameter.Value --output text)
          echo "::add-mask::$DATABASE_URL"
          export DATABASE_URL
          pnpm --filter api exec prisma migrate deploy

      - name: Release on Lambda
        run: |
          aws lambda update-function-code --function-name "${{ vars.API_FUNCTION_NAME }}" --image-uri "${{ steps.image.outputs.uri }}" > /dev/null
          aws lambda wait function-updated-v2 --function-name "${{ vars.API_FUNCTION_NAME }}"

      - name: Smoke test
        run: sh infra/smoke.sh "${{ vars.DOMAIN }}"
