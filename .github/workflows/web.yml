name: web

on:
  push:
    branches: [main]
    paths:
      - apps/web/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/web.yml
  workflow_dispatch:

concurrency:
  group: web-deploy
  cancel-in-progress: false

# Actions are pinned to commit SHAs (tags can be moved to malicious code; these jobs get AWS credentials).
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: corepack enable && pnpm install --frozen-lockfile --filter web
      - run: pnpm --filter web lint
      - run: pnpm --filter web test
      - run: pnpm --filter web build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    # The AWS deploy role only trusts this environment (restricted to main, optional manual approval in GitHub).
    environment: production
    permissions:
      contents: read
      id-token: write # OIDC: short-lived AWS credentials, no stored keys
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-dist
          path: dist

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          mask-aws-account-id: true # public repo: public logs
          role-to-assume: ${{ secrets.AWS_WEB_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      # Assets first, index.html last: the new page never references files that aren't there yet.
      # Hashed assets never change (cached for a year); index.html is always revalidated.
      # No --delete: a visitor with the previous page open can still lazy-load its chunks (a few hundred KB per deploy).
      - name: Upload to S3
        run: |
          aws s3 sync dist "s3://${{ secrets.WEB_BUCKET }}" --exclude index.html --cache-control "public, max-age=31536000, immutable"
          aws s3 cp dist/index.html "s3://${{ secrets.WEB_BUCKET }}/index.html" --cache-control "no-cache"

      - name: Invalidate index.html at the edge
        run: aws cloudfront create-invalidation --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION }}" --paths /index.html > /dev/null
