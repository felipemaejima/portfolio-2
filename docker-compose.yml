services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    env_file: .env
    command: sh -c "pnpm install && pnpm --filter api exec prisma generate && pnpm --filter api exec prisma migrate deploy && pnpm --filter api dev"
    ports:
      - "${API_PORT:-3000}:3000"
      - "${STUDIO_PORT:-5555}:5555" # prisma studio
    volumes:
      - .:/app
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    # Ready = dependencies installed, migrations applied and the app answering (the web service waits for it).
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      retries: 60
      start_period: 120s

  # Vite dev server. Same toolchain image as the api (Node + pnpm); it proxies /api and /uploads to the api
  # service, so the browser sees a single origin, exactly like CloudFront in production.
  web:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    command: pnpm --filter web dev
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - .:/app
    depends_on:
      api:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
      POSTGRES_DB: portfolio
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio"]
      interval: 2s
      retries: 30

  db-test:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
      POSTGRES_DB: portfolio_test
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio"]
      interval: 2s
      retries: 30
    profiles: [test]

volumes:
  uploads:
  db_data:
